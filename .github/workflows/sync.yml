name: Tinkoff Invest Sync

on:
  # Расписание — каждые 15 минут, чтобы данные были почти всегда актуальными
  schedule:
  - cron: '*/15 * * * *'

  # Возможность запустить вручную из интерфейса GitHub
  workflow_dispatch:
    inputs:
      test_notify:
        description: 'Отправить тестовое сообщение в Telegram (проверка секретов)'
        type: boolean
        default: false

# Не запускать два синка одновременно: иначе они могут перезаписывать листы
# друг другу и задвоить строку снимка за день. Новый запуск ждёт старый.
concurrency:
  group: tinkoff-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # actions: read — чтобы notify.sh мог посмотреть итоги прошлых запусков
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Серверы Т-Банка (pip-индекс и API) используют сертификаты УЦ Минцифры,
      # которых нет в стандартных списках доверенных на раннерах GitHub.
      # Добавляем их в системное хранилище и указываем pip и gRPC брать его.
      - name: Trust Russian CA certificates
        run: |
          sudo cp certs/*.crt /usr/local/share/ca-certificates/
          sudo update-ca-certificates
          echo "PIP_CERT=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
          echo "GRPC_DEFAULT_SSL_ROOTS_FILE_PATH=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run invest.py
        env:
          TINKOFF_TOKEN:      ${{ secrets.TINKOFF_TOKEN }}
          APPS_SCRIPT_URL:    ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
        run: python invest.py

      # Выполняется всегда (и при ошибке выше). Пишет в Telegram только при
      # смене состояния: сломался (2 провала подряд) / починился. См. notify.sh.
      # Секреты TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID добавить в Settings → Secrets;
      # пока их нет, шаг просто пропускается.
      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN:    ${{ github.token }}
          TEST_NOTIFY: ${{ inputs.test_notify }}
        run: bash .github/scripts/notify.sh "${{ job.status }}"