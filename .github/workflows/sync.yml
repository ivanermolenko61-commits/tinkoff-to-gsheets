name: Tinkoff Invest Sync

on:
  # Расписание — каждый день в 06:00 UTC (= 09:00 МСК)
  schedule:
    - cron: '0 6 * * *'

  # Возможность запустить вручную из интерфейса GitHub
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run invest.py
        env:
          TINKOFF_TOKEN:      ${{ secrets.TINKOFF_TOKEN }}
          APPS_SCRIPT_URL:    ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
        run: python invest.py