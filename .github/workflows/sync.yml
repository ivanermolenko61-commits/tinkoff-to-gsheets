name: Tinkoff Invest Sync

on:
  # Расписание — каждые 15 минут, чтобы данные были почти всегда актуальными
  schedule:
  - cron: '*/15 * * * *'

  # Возможность запустить вручную из интерфейса GitHub
  workflow_dispatch:

# Не запускать два синка одновременно: иначе они могут перезаписывать листы
# друг другу и задвоить строку снимка за день. Новый запуск ждёт старый.
concurrency:
  group: tinkoff-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Серверы Т-Банка (pip-индекс и API) используют сертификаты УЦ Минцифры,
      # которых нет в стандартных списках доверенных на раннерах GitHub.
      # Добавляем их в системное хранилище и указываем pip и gRPC брать его.
      - name: Trust Russian CA certificates
        run: |
          sudo cp certs/*.crt /usr/local/share/ca-certificates/
          sudo update-ca-certificates
          echo "PIP_CERT=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
          echo "GRPC_DEFAULT_SSL_ROOTS_FILE_PATH=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run invest.py
        env:
          TINKOFF_TOKEN:      ${{ secrets.TINKOFF_TOKEN }}
          APPS_SCRIPT_URL:    ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
        run: python invest.py